name: AI Paper Bot — unit tests
on:
  push:
    paths:
      - 'ai-paper-bot/**'
  pull_request:
    paths:
      - 'ai-paper-bot/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-paper-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
